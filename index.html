function zoom(f,x=svg.clientWidth/2,y=svg.clientHeight/2){let z=Math.max(.03,Math.min(20,cam.z*f));cam.x=x-(x-cam.x)*z/cam.z;cam.y=y-(y-cam.y)*z/cam.z;cam.z=z;render();save()}svg.addEventListener('wheel',e=>{e.preventDefault();let r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});$('plus').onclick=()=>zoom(1.25);$('minus').onclick=()=>zoom(.8);$('home').onclick=()=>{cam={x:0,y:0,z:1};render();save()};$('undo').onclick=()=>{if(history.length){future.push(JSON.stringify(data));data=JSON.parse(history.pop());render();save()}};$('redo').onclick=()=>{if(future.length){history.push(JSON.stringify(data));data=JSON.parse(future.pop());render();save()}};$('lineStyle').onchange=()=>{let o=data.find(n=>n.id===selected);if(o){checkpoint();o.style=$('lineStyle').value;render();save()}};$('pattern').onchange=$('material').onchange=()=>{render();save()};$('image').onclick=()=>$('file').click();$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;let origin=active,r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{if(origin!==active){toast('Доска изменилась, загрузите фото повторно');return}let w=Math.min(600,im.width);add({type:'image',x:(100-cam.x)/cam.z,y:(100-cam.y)/cam.z,w,h:w*im.height/im.width,src:r.result})};im.src=r.result};r.readAsDataURL(f);$('file').value=''};function download(s,type,name){let u=URL.createObjectURL(new Blob([s],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('export').onclick=()=>{let b=world.getBBox(),c=world.cloneNode(true);c.removeAttribute('transform');download(`<svg xmlns="${ns}" viewBox="${b.x-20} ${b.y-20} ${Math.max(40,b.width+40)} ${Math.max(40,b.height+40)}">${new XMLSerializer().serializeToString(c)}</svg>`,'image/svg+xml','board.svg')};$('backup').onclick=()=>download(JSON.stringify({data,cam,pattern:$('pattern').value,material:$('material').value}),'application/json','board.json');$('restore').onclick=()=>$('importFile').click();$('importFile').onchange=async()=>{try{let s=JSON.parse(await $('importFile').files[0].text());if(!Array.isArray(s.data))throw 0;checkpoint();data=s.data;cam=s.cam||cam;$('pattern').value=s.pattern||'dots';$('material').value=s.material||'#fafafa';render();save()}catch{toast('Неверный файл')}};document.addEventListener('keydown',e=>{if(editing||$('boardDialog').open||['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='Delete'&&selected){checkpoint();data=data.filter(o=>o.id!==selected&&o.from!==selected&&o.to!==selected);selected=null;render();save()}});$('login').onsubmit=async e=>{
  e.preventDefault();$('error').textContent='';
  try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);}
  catch(err){$('error').textContent=err.code==='auth/invalid-credential'?'Неверная почта или пароль':(err.message||'Не удалось войти');}
};
$('logout').onclick=async()=>{await signOut(auth);$('gate').style.display='grid';$('password').value='';};$('chatToggle').onclick=()=>{$('chat').style.display=$('chat').style.display==='none'?'flex':'none'};let chatKey=active==='legacy'?'triz-chat':'triz-chat-v2-'+active;
function messages(){return cloudMessages.filter(m=>m.boardId===active);}
function showChat(){
  $('messages').replaceChildren();
  for(let m of messages()){
    let p=document.createElement('p');
    let when=m.created?.toDate?m.created.toDate().toLocaleTimeString():new Date().toLocaleTimeString();
    p.textContent=m.name+' · '+when+'\n'+m.text;
    p.style.whiteSpace='pre-wrap';$('messages').append(p);
  }
  $('messages').scrollTop=$('messages').scrollHeight;
}
$('name').value=store.getItem('triz-name')||'';
$('send').onsubmit=async e=>{
  e.preventDefault();
  if(!cloudEnabled||!cloudUser){toast('Сначала войдите в Firebase');return;}
  let text=$('msg').value.trim();if(!text)return;
  if(text.length>3500){toast('Сообщение слишком длинное (максимум 3500 символов)');return;}
  let name=$('name').value.trim()||$('email')?.value?.split('@')[0]||'Участник';
  store.setItem('triz-name',name);
  try{
    await addDoc(collection(db,'messages'),{
      uid:cloudUser.uid,name,
      text:JSON.stringify({boardId:active,text}),
      created:serverTimestamp()
    });
    $('msg').value='';
  }catch(err){toast('Не удалось отправить сообщение: '+(err.code||err.message));}
};$('notify').onclick=async()=>{if(!('Notification'in window)){toast('Браузер не поддерживает уведомления');return}try{let p=await Notification.requestPermission();toast(p==='granted'?'Разрешено для локальных событий, пока приложение открыто':'Уведомления не разрешены')}catch{toast('Для уведомлений нужен поддерживаемый браузер и HTTPS')}};function startBoardSync(){
  if(stopBoard){stopBoard();stopBoard=null;}
  if(!cloudEnabled||!cloudUser)return;
  stopBoard=onSnapshot(doc(db,'objects',active),snap=>{
    if(!snap.exists()){
      const state={data,cam,pattern:$('pattern').value,material:$('material').value};
      const value=JSON.stringify(state);
      if(value.length<=800000)setDoc(doc(db,'objects',active),{value}).catch(console.error);
      return;
    }
    try{
      const state=JSON.parse(snap.data().value||'{}');
      if(drag||editing)return;
      cloudApplying=true;
      data=Array.isArray(state.data)?state.data:[];
      cam=state.cam||{x:0,y:0,z:1};
      $('pattern').value=state.pattern||'dots';
      $('material').value=state.material||'#fafafa';
      store.setItem(key,JSON.stringify(state));
      render();cloudApplying=false;
      $('status').textContent='☁ Синхронизировано';
    }catch(err){cloudApplying=false;console.error(err);toast('Не удалось прочитать состояние доски');}
  },err=>{console.error(err);toast('Ошибка синхронизации доски: '+err.message);});
}
function startMessageSync(){
  if(stopMessages){stopMessages();stopMessages=null;}
  if(!cloudEnabled)return;
  stopMessages=onSnapshot(query(collection(db,'messages'),orderBy('created','asc'),limit(150)),snap=>{
    cloudMessages=snap.docs.map(d=>({id:d.id,...d.data()})).map(m=>{
      try{const payload=JSON.parse(m.text);if(payload&&typeof payload==='object')return {...m,boardId:payload.boardId,text:payload.text};}catch{}
      return {...m,boardId:'legacy'};
    });
    showChat();
    const latest=cloudMessages.filter(m=>m.boardId===active).at(-1);
    if(latest&&latest.uid!==cloudUser?.uid&&'Notification'in window&&Notification.permission==='granted'){
      try{new Notification(latest.name,{body:latest.text})}catch{}
    }
  },err=>{console.error(err);toast('Ошибка загрузки чата: '+err.message);});
}
function startCloud(){
  cloudEnabled=true;
  if(stopBoards)stopBoards();
  stopBoards=onSnapshot(collection(db,'boards'),async snap=>{
    const incoming=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.archived!==true);
    if(!incoming.length){
      for(const p of projects){
        await setDoc(doc(db,'boards',p.id),{name:p.name,pattern:$('pattern').value,material:$('material').value,archived:false},{merge:true});
      }
      const state={data,cam,pattern:$('pattern').value,material:$('material').value};
      const value=JSON.stringify(state);
      if(value.length<=800000)await setDoc(doc(db,'objects',active),{value},{merge:true});
      return;
    }
    projects=incoming.map(p=>({id:p.id,name:p.name||'Без названия'}));
    if(!projects.some(p=>p.id===active)){
      active=projects[0].id;
      key=active==='legacy'?'triz-board-v1':'triz-board-v2-'+active;
      chatKey=active==='legacy'?'triz-chat':'triz-chat-v2-'+active;
    }
    projectMenu();
    persistProjectsLocal();
    startBoardSync();showChat();
  },err=>{console.error(err);toast('Ошибка загрузки списка досок: '+err.message);});
  startMessageSync();
}
function persistProjectsLocal(){
  try{store.setItem(indexKey,JSON.stringify(projects));store.setItem('triz-active-v2',active);}catch{}
}function projectMenu(){ $('projects').replaceChildren();for(const p of projects){let o=document.createElement('option');o.value=p.id;o.textContent=p.name;$('projects').append(o)}$('projects').value=active; }function persistProjects(){
  persistProjectsLocal();projectMenu();
  if(cloudEnabled&&cloudUser){
    const p=projects.find(p=>p.id===active);
    if(p)setDoc(doc(db,'boards',active),{name:p.name,pattern:$('pattern').value,material:$('material').value,archived:false},{merge:true}).catch(err=>toast('Не удалось сохранить название доски: '+err.message));
  }
}function switchProject(next,keep=true){if(drag)return;finishEditor(false);if(keep)save();active=next;key=active==='legacy'?'triz-board-v1':'triz-board-v2-'+active;chatKey=active==='legacy'?'triz-chat':'triz-chat-v2-'+active;let s=load();data=s.data||[];cam=s.cam||{x:0,y:0,z:1};$('pattern').value=s.pattern||'dots';$('material').value=s.material||'#fafafa';history=[];future=[];selected=null;linkStart=null; $('msg').value='';persistProjects();render();showChat();if(cloudEnabled)startBoardSync()}$('projects').onchange=()=>switchProject($('projects').value);$('newProject').onclick=async()=>{let name=await ask('Название новой доски','');if(!name?.trim())return;let p={id:id(),name:name.trim()};projects.push(p);switchProject(p.id)};$('renameProject').onclick=async()=>{let p=projects.find(p=>p.id===active),name=await ask('Название доски',p.name);if(name?.trim()){p.name=name.trim();persistProjects()}};$('deleteProject').onclick=async()=>{
  if(projects.length===1){toast('Оставьте хотя бы одну доску');return;}
  if(!await ask('Архивировать эту доску?'))return;
  try{if(cloudEnabled)await updateDoc(doc(db,'boards',active),{archived:true});}catch(err){toast('Не удалось архивировать доску: '+err.message);return;}
  store.removeItem(key);store.removeItem(chatKey);
  projects=projects.filter(p=>p.id!==active);switchProject(projects[0].id,false);
};persistProjects();setTool('select');render();showChat();if(!persistent)$('status').textContent='Временный режим: экспортируйте JSON';

// Firebase session: browserLocalPersistence keeps the user signed in on this device.
await setPersistence(auth,browserLocalPersistence);
onAuthStateChanged(auth,async user=>{
  cloudUser=user;
  if(!user){
    cloudEnabled=false;
    if(stopBoards){stopBoards();stopBoards=null;}
    if(stopBoard){stopBoard();stopBoard=null;}
    if(stopMessages){stopMessages();stopMessages=null;}
    $('gate').style.display='grid';
    $('status').textContent='Не выполнен вход';
    return;
  }
  try{
    const memberSnap=await getDoc(doc(db,'members',user.uid));
    if(!memberSnap.exists()||memberSnap.data().active!==true){
      await signOut(auth);
      $('error').textContent='Для этого аккаунта доступ к доске не включён. Обратитесь к администратору.';
      return;
    }
    $('gate').style.display='none';
    $('status').textContent='Подключение к облаку…';
    startCloud();
  }catch(err){
    console.error(err);
    $('gate').style.display='grid';
    $('error').textContent='Не удалось проверить доступ: '+(err.message||err.code);
  }
});
function treeNode(text,parent=null){let fs=18,{w,h}=textDimensions(text,fs);let n={id:id(),type:'node',tree:true,parent:parent?.id||null,text,fontSize:fs,w,h,x:parent?parent.x+parent.w+100:(svg.clientWidth/2-cam.x)/cam.z,y:parent?parent.y:(svg.clientHeight/2-cam.y)/cam.z,color:'#ffffff',width:2};data.push(n);if(parent)data.push({id:id(),type:'link',tree:true,from:parent.id,to:n.id,color:'#e4f2f2',width:2,x:0,y:0});return n}
function treeArrange(root){let seen=new Set();function walk(n,side,x,y){if(seen.has(n.id))return 0;seen.add(n.id);let children=data.filter(c=>c.tree&&c.type==='node'&&c.parent===n.id);n.x=x;n.y=y;let cursor=y;for(let c of children){let cx=side>0?x+n.w+85:x-c.w-85;cursor+=walk(c,side,cx,cursor)+18}let height=Math.max(n.h,cursor-y-18);n.y=y+(height-n.h)/2;return height}let kids=data.filter(n=>n.tree&&n.type==='node'&&n.parent===root.id);for(let side of [-1,1]){let group=kids.filter((_,i)=>(i%2?1:-1)===side),cursor=root.y;for(let n of group)cursor+=walk(n,side,side>0?root.x+root.w+100:root.x-n.w-100,cursor)+30;let shift=(cursor-root.y-30-root.h)/2;function move(n){n.y-=shift;data.filter(c=>c.tree&&c.type==='node'&&c.parent===n.id).forEach(move)}group.forEach(move)}}
function treeSelected(){return data.find(n=>n.id===selected&&n.tree&&n.type==='node')}
$('treeRoot').onclick=()=>{checkpoint();let n=treeNode('Главная тема');selected=n.id;render();save();setTool('select');openEditor('node',n,n)};
$('treeChild').onclick=()=>{let p=treeSelected();if(!p)return toast('Выберите блок дерева');checkpoint();let n=treeNode('Новая ветвь',p);let root=p;while(root.parent&&data.find(c=>c.id===root.parent))root=data.find(c=>c.id===root.parent);treeArrange(root);selected=n.id;render();save();openEditor('node',n,n)};
$('treeLayout').onclick=()=>{checkpoint();data.filter(n=>n.tree&&n.type==='node'&&!n.parent).forEach(treeArrange);render();save()};
$('treeExample').onclick=()=>{checkpoint();$('material').value='#4c98a8';$('pattern').value='none';let root=treeNode('ЭЭГ-комплекс');for(let [name,...items] of [['Шлем','Основа','Форма','Давление'],['Датчики','Корпус','Контакт','Шумы'],['Гель','Нанесение','Высыхание','Очистка'],['Провода','Натяжение','Помехи'],['Процедура','Подготовка','Запись'],['ПО и ИИ','Фильтры','Данные','Обучение']]){let p=treeNode(name,root);items.forEach(t=>treeNode(t,p))}treeArrange(root);render();save()};
